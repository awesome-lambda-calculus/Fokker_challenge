name = "Fokker_challenge"
version = "0.1.0"
defaultTargets = ["fokker_challenge"]

[[lean_lib]]
name = "FokkerChallenge"

# Statement-only file used with https://github.com/leanprover/comparator
[[lean_lib]]
name = "Challenge"

# Proofs of the statements of `Challenge`, checked by comparator
[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "fokker_challenge"
root = "Main"

[[lean_exe]]
name = "encode"
root = "FokkerChallenge.EncoderDecoder.Encode"

[[lean_exe]]
name = "decode"
root = "FokkerChallenge.EncoderDecoder.Decode"

[[lean_exe]]
name = "blc"
root = "FokkerChallenge.BLC.Blc"

[[require]]
name = "cslib"
git = "https://github.com/awesome-lambda-calculus/cslib"
rev = "sn_eta_step"
